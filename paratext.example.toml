# paratext config — edit for your environment.
# `paratext config` seeds a copy of this file; `paratext config --show -p <project>`
# resolves it.
#
# Resolution order (highest first):
#   CLI flags  >  PARATEXT_* env vars  >  [project.<name>]  >  top-level keys
# Keys are kebab-case, matching the CLI flag that sets them: --base-url -> base-url.

base-url = "http://localhost:8000/v1"   # any OpenAI-compatible model server
# model  = "Qwen3-VL-30B"               # a model id your server serves (required)
# review-port = 5050                    # port for `paratext review`
# max-tokens  = 8192                    # output ceiling per call; raise for thinking models

# The bundled starter project. `source` is a flat directory of card images.
[project.cards]
source     = "data/cards"
output     = "output/cards.jsonl"
# review-out pins one directory and turns OFF round auto-naming, so editing the
# prompt no longer opens a new round to compare against. Leave it unset unless
# that's what you want.
# review-out = "review/cards"
# Editing the prompt makes existing extractions stale, and paratext stops rather
# than resuming into them. On a small collection where a re-run is cheap, this
# discards them and calls the model again instead — the run/edit/re-run loop
# then needs no flag. Leave it off for anything big or metered.
# re-extract = true

# Verbatim passthrough into the request body — for provider parameters paratext
# doesn't model. Reasoning controls live here, and every provider spells them
# differently. paratext's own `disable_thinking` sends the vLLM/Qwen form.
# [project.cards.extra-body]
# reasoning = { enabled = false }                       # OpenRouter
# chat_template_kwargs = { enable_thinking = false }    # vLLM / llama.cpp / Lemonade
# reasoning_effort = "low"                              # OpenAI, and Qwen3.8

# Energy and emissions. Every local run is measured; declare your grid so
# emissions can be computed (region is far more precise than national: South
# Scotland is often ~85% wind vs ~35% GB-wide). `paratext carbon` shows the grid
# and writes the report; `paratext config --suggest-region` proposes this block.
# [carbon]
# region = "south-scotland"  # UK DNO region slug/id or outcode; see docs/carbon.md
# wait   = true              # pause runs while renewables are below 70%
