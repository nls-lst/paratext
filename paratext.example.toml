# paratext config — copy to `paratext.toml` and edit for your environment.
# Open it any time with `paratext config`; see resolved values with
# `paratext config --show -p <project>`.
#
# Resolution order (highest first):
#   1. CLI flags          e.g. `paratext run -p cards --limit 5`
#   2. PARATEXT_* env vars e.g. `PARATEXT_MODEL=...` (handy in containers)
#   3. [project.<name>]    per-project overrides below
#   4. top-level keys      shared across projects
# Keys may be kebab-case (base-url) or snake_case (base_url).

base-url = "http://localhost:1235/v1"
model    = "Qwen3-VL-30B"

# The bundled generic starter project. `source` is a flat directory of card
# images; `iter_samples` is non-recursive.
[project.cards]
source     = "/data/cards/images"
output     = "output/cards.jsonl"
review-out = "review/cards"
