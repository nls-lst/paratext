name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (dev + pdf extras)
        run: uv sync --extra dev --extra pdf
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest -q
