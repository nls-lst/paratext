[project]
name = "paratext"
version = "0.1.0"
description = "Plugin VLM metadata-extraction pipeline for digitised library/archive collections"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "openai~=2.17",
    "stamina~=25.2",
    "numpy>=1.26",
    "pillow~=12.1",
    "pydantic~=2.12",
    "tqdm~=4.67",
    "huggingface-hub~=1.4",
    "rich>=14.3.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.0"]
# Scanned-card cropping: the permissive (BSD) torchvision RetinaNet detector in
# paratext.cards. CPU inference is fine (~0.5s/image). `pip install paratext[cards]`.
cards = ["torch>=2.4", "torchvision>=0.19"]
# PDF rendering for page-image projects.
pdf = ["pypdfium2~=5.4"]

[project.scripts]
paratext = "paratext.cli:main"

# Projects are discovered via this entry-point group, so downstream packages can
# register their own. The bundled generic starter is `cards`.
[project.entry-points."paratext.projects"]
cards = "paratext.projects.cards:PROJECT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paratext"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
