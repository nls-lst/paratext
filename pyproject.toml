[project]
# Distribution name only. The import package and the CLI are both `paratext`;
# the plain name on PyPI belongs to an unrelated project, so the distribution
# carries the `-cli` suffix.
name = "paratext-cli"
version = "0.5.2"
description = "Modular, project-based metadata extraction from digitised library/archive collections with a multimodal model"
readme = "README.md"
# Core is pure-Python + numpy/pillow/pydantic. The [detector] extra needs
# torch/torchvision, which have shipped cp314 wheels since 2.9.0/0.24.0 — no
# ceiling here; version constraints are the dependencies' to enforce at install.
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "openai~=2.17",
    "stamina~=25.2",
    "numpy>=1.26",
    "pillow~=12.1",
    "pydantic~=2.12",
    "tqdm~=4.67",
    "huggingface-hub~=1.4",
    "rich>=14.3.2",
    # PDF page rendering. Small self-contained wheel (bundles PDFium, no extra
    # Python deps), so it's a core dependency rather than an extra.
    "pypdfium2~=5.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.0"]
# Object-detection runtime for the card cropper (paratext.cards): the permissive
# (BSD) torchvision RetinaNet. Heavy (torch is hundreds of MB) and card-specific,
# so it stays opt-in. CPU inference is fine (~0.5s/image).
# `pip install paratext[detector]`.
detector = ["torch>=2.4", "torchvision>=0.19"]

[project.scripts]
paratext = "paratext.cli:main"

# Projects are discovered via this entry-point group, so downstream packages can
# register their own. The bundled worked example is `card-template`.
[project.entry-points."paratext.projects"]
card-template = "paratext.projects.card_template:PROJECT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paratext"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
